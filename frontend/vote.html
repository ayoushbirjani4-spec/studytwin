<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Vote on which line the class twin got wrong" />
  <title>Vote · StudyTwin</title>
  <script>
    try {
      var savedTheme = localStorage.getItem("studytwin_theme");
      if (savedTheme === "dark" || savedTheme === "light") {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch (e) {}
  </script>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#2847a8" />
  <link rel="icon" href="/icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="./css/style.css?v=20261121-5" />
</head>
<body>
  <main class="vote-page">
    <div class="brand">
      <strong>StudyTwin</strong>
      <span id="voteClassName">Class twin</span>
    </div>

    <form id="voteCodeForm" class="vote-code hidden">
      <label>Class code<input id="voteCodeInput" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC234" required /></label>
      <button class="primary-button" type="submit">Join</button>
    </form>

    <p id="voteStatus" class="vote-status" aria-live="polite"></p>

    <section id="voteBallot" class="hidden">
      <h1 id="voteQuestion" class="vote-question"></h1>
      <p class="vote-help">Which line did the twin get wrong? Tap it. You can change your vote until your teacher closes it.</p>
      <ol id="voteLines" class="vote-lines"></ol>
    </section>
  </main>

  <script src="./js/vote.js?v=20261121-5"></script>
</body>
</html>
